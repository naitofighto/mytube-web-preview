name: MyTube sidebar menu end-to-end QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/tv-menu-navigation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-navigation-failure
          path: menu-navigation-failure.png
          if-no-files-found: ignore
