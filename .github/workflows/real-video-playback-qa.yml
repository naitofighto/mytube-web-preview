name: MyTube real video playback QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mytube-http.log 2>&1 &
          sleep 2
          node tests/real-video-playback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-playback-failure
          path: video-*-failure.png
          if-no-files-found: ignore
