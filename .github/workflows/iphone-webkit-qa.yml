name: MyTube iPhone WebKit QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - run: node tests/iphone-webkit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-webkit-screenshots
          path: iphone-*.png
          if-no-files-found: ignore
