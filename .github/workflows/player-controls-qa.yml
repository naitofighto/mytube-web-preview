name: MyTube player controls QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/tv-player-controls.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-qa-failure
          path: player-qa-failure.png
          if-no-files-found: ignore
