name: MyTube iPhone player buttons QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buttons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mytube-http.log 2>&1 &
          sleep 2
          node tests/iphone-player-buttons.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-player-buttons-screenshots
          path: iphone-player-buttons*.png
          if-no-files-found: ignore
